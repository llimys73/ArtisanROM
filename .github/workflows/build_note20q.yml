name: Build Note 20 Snapdragon (c1q / c2q)

# Personal build of the Note 20 Snapdragon ports. Runs only when started manually
# from the Actions tab of your fork. Per device, set:
#   <DEV>_FIRMWARE     (secret)   e.g. C2Q_FIRMWARE = SM-N986N/KOO/<IMEI or its first 8 digits>
#                                      C1Q_FIRMWARE = SM-N981N/KOO/<IMEI or its first 8 digits>
#   <DEV>_KERNEL_REPO  (variable) e.g. C2Q_KERNEL_REPO = https://github.com/<you>/kernel_samsung_sm8250/releases/download/c2q-kor
#                                      C1Q_KERNEL_REPO = https://github.com/<you>/kernel_samsung_sm8250/releases/download/c1q-kor
# Signed with the public AOSP test keys (no ArtisanROM signing keys needed).

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'c2q = Note 20 Ultra, c1q = Note 20'
        type: choice
        options: ['c2q', 'c1q']
        default: 'c2q'
      sim:
        description: 'SIM trays (1 = Korean N986N/N981N, 2 = N9860/N9810)'
        type: choice
        options: ['1', '2']
        default: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DEVICE: ${{ github.event.inputs.device }}
      C2Q_FIRMWARE: ${{ secrets.C2Q_FIRMWARE }}
      C2Q_KERNEL_REPO: ${{ vars.C2Q_KERNEL_REPO }}
      C2Q_SIM_TRAYCOUNT: ${{ github.event.inputs.sim }}
      C1Q_FIRMWARE: ${{ secrets.C1Q_FIRMWARE }}
      C1Q_KERNEL_REPO: ${{ vars.C1Q_KERNEL_REPO }}
      C1Q_SIM_TRAYCOUNT: ${{ github.event.inputs.sim }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Check inputs
        run: |
          P="${DEVICE^^}"
          FW_VAR="${P}_FIRMWARE"; KR_VAR="${P}_KERNEL_REPO"
          [ -n "${!FW_VAR}" ] || { echo "::error::Set the ${FW_VAR} secret"; exit 1; }
          if [ -f "target/$DEVICE/kernel-prebuilt/boot.img" ] && [ -f "target/$DEVICE/kernel-prebuilt/dtbo.img" ]; then
            echo "Using prebuilt kernel from target/$DEVICE/kernel-prebuilt"
          else
            [ -n "${!KR_VAR}" ] || { echo "::error::Upload boot.img/dtbo.img to target/$DEVICE/kernel-prebuilt or set the ${KR_VAR} variable"; exit 1; }
          fi

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential python-is-python3 python3 wget
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          source ./buildenv.sh "$DEVICE"
          ./scripts/build_dependencies.sh

      - name: Download firmware (S22 source + target)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh "$DEVICE" && ./scripts/download_fw.sh

      - name: Extract firmware
        run: |
          source ./buildenv.sh "$DEVICE"
          ./scripts/extract_fw.sh

      - name: Add swapspace
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - name: Build ROM
        run: |
          source ./buildenv.sh "$DEVICE"
          ./scripts/make_rom.sh --beta

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanROM-${{ github.event.inputs.device }}
          path: out/*.zip
          compression-level: 0
          retention-days: 5
