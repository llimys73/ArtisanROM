# Put this file at .github/workflows/build_kernel_note20.yml in your fork of
# https://github.com/UN1CA/kernel_samsung_sm8250, together with build_kernel.sh
# in the repository root. Run it from the Actions tab.
name: Build Note 20 kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'c2q = Note 20 Ultra, c1q = Note 20'
        type: choice
        options: [c2q, c1q]
        default: c2q
      region:
        description: 'kor = SM-N986N/N981N, chn = SM-N9860/N9810'
        type: choice
        options: [kor, chn]
        default: kor
      release:
        description: 'Publish boot.img/dtbo.img as a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libssl-dev python3 unzip wget zip zstd

      - name: Download prebuilt Google clang
        run: |
          wget -q --no-cookies --header "Cookie: gi=0" -O clang.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r547379.tar.gz
          mkdir clang-r547379
          tar -xf clang.tar.gz -C clang-r547379
          rm clang.tar.gz

      - name: Build kernel
        env:
          DEVICE: ${{ github.event.inputs.device }}
          REGION: ${{ github.event.inputs.region }}
        run: bash build_kernel.sh

      # Fixed tag per device/region (e.g. c1q-kor), refreshed on every build, so the
      # ROM can always download from .../releases/download/<device>-<region>
      - name: Set release tag
        run: echo "TAG=${{ github.event.inputs.device }}-${{ github.event.inputs.region }}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            boot.img
            dtbo.img

      - name: Publish release
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: UN1CA-${{ env.TAG }}
          make_latest: false
          overwrite_files: true
          files: |
            boot.img
            dtbo.img
